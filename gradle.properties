# Project-wide Gradle settings for the reconstructed DiabloLOL project.

# The decompiled sources mix the original android.support.* usage with the
# AndroidX artifacts the reconstructed build depends on.
android.useAndroidX=true
android.enableJetifier=false

# The original APK targeted compileSdk 23; the sources use APIs predating
# AndroidX namespace enforcement, so keep the non-transitive R class.
android.nonTransitiveRClass=false

# compileSdk 35 with AGP 8.5.2 is a supported combination; silence the
# "untested compileSdk" notice.
android.suppressUnsupportedCompileSdk=35

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The decompiled sources use R fields in switch/case labels (e.g. EgameDialog),
# which requires compile-time constants. AGP 8 defaults to non-final resource
# ids, so keep them final/constant as they were in the original build.
android.nonFinalResIds=false
